<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - SnapShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: #fafafa;
            overflow-x: hidden;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e5e5;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, #0095f6, #ff006b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .main-content {
            margin-top: 70px;
            padding: 20px 0;
            min-height: calc(100vh - 70px);
        }
        
        .messages-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            height: calc(100vh - 110px);
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .messages-sidebar {
            width: 350px;
            border-right: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
        }
        
        .messages-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid #e5e5e5;
        }
        
        .messages-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #262626;
        }
        
        .new-message-btn {
            background: #0095f6;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .new-message-btn:hover {
            background: #0077cc;
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .conversation-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
        }
        
        .conversation-item:hover {
            background: #f8f9fa;
        }
        
        .conversation-item.active {
            background: #e3f2fd;
        }
        
        .conversation-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        
        .conversation-info {
            flex: 1;
            min-width: 0;
        }
        
        .conversation-name {
            font-weight: 600;
            font-size: 14px;
            color: #262626;
            margin-bottom: 4px;
        }
        
        .conversation-preview {
            font-size: 14px;
            color: #8e8e8e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .unread-dot {
            width: 8px;
            height: 8px;
            background: #0095f6;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8e8e8e;
        }
        
        .placeholder-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.6;
        }
        
        .chat-placeholder h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #262626;
        }
        
        .chat-placeholder p {
            font-size: 14px;
        }
        
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid #e5e5e5;
        }
        
        .chat-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .chat-user-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 2px;
        }
        
        .chat-status {
            font-size: 12px;
            color: #8e8e8e;
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        .chat-action-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        
        .chat-action-btn:hover {
            background: #f5f5f5;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            display: flex;
            max-width: 70%;
        }
        
        .message.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .message.received {
            align-self: flex-start;
        }
        
        .message-content {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .message.sent .message-content {
            background: #0095f6;
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        
        .message.received .message-content {
            background: #efefef;
            color: #262626;
            border-bottom-left-radius: 6px;
        }
        
        .message-time {
            font-size: 11px;
            color: #8e8e8e;
            margin-top: 4px;
            align-self: flex-end;
        }
        
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .chat-input {
            flex: 1;
            border: 1px solid #e5e5e5;
            border-radius: 24px;
            padding: 12px 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .chat-input:focus {
            border-color: #0095f6;
        }
        
        .send-button {
            background: #0095f6;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        
        .send-button:hover {
            background: #0077cc;
        }
        
        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #e5e5e5;
            padding: 12px 0;
            display: none;
            z-index: 1000;
        }
        
        .bottom-nav-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #262626;
            font-size: 12px;
        }
        
        .bottom-nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                padding: 20px 0 80px;
            }
            
            .messages-container {
                height: calc(100vh - 150px);
            }
            
            .messages-sidebar {
                width: 100%;
            }
            
            .chat-area {
                display: none;
            }
            
            .bottom-nav {
                display: block;
            }
        }
        
        @media (max-width: 480px) {
            .messages-header {
                padding: 16px;
            }
            
            .conversation-item {
                padding: 12px 16px;
            }
            
            .conversation-avatar {
                width: 44px;
                height: 44px;
            }
            
            .chat-header {
                padding: 16px;
            }
            
            .chat-messages {
                padding: 16px;
            }
            
            .chat-input-area {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="logo">SnapShare</div>
            
            <div class="hidden md:block">
                <input type="text" class="search-input" placeholder="Search">
            </div>
            
            <div class="flex items-center gap-4">
                <div class="nav-icon">🏠</div>
                <div class="nav-icon">💬</div>
                <div class="nav-icon">➕</div>
                <div class="nav-icon">🧭</div>
                <img src="/resources/images/avatars/avatar1.png" alt="Profile" class="w-8 h-8 rounded-full cursor-pointer">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="messages-container">
            <!-- Messages Sidebar -->
            <div class="messages-sidebar">
                <div class="messages-header">
                    <h2>Messages</h2>
                    <button class="new-message-btn">+</button>
                </div>
                
                <div class="conversations-list">
                    <!-- Conversations will be loaded here by JavaScript -->
                </div>
            </div>
            
            <!-- Chat Area -->
            <div class="chat-area">
                <div class="chat-placeholder">
                    <div class="placeholder-icon">💬</div>
                    <h3>Select a conversation</h3>
                    <p>Choose a friend to start chatting</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="bottom-nav-items">
            <a href="index.html" class="bottom-nav-item">
                <div class="bottom-nav-icon">🏠</div>
                <span>Home</span>
            </a>
            <a href="messages.html" class="bottom-nav-item" style="color: #0095f6;">
                <div class="bottom-nav-icon">💬</div>
                <span>Messages</span>
            </a>
            <a href="upload.html" class="bottom-nav-item">
                <div class="bottom-nav-icon">➕</div>
                <span>Create</span>
            </a>
            <a href="profile.html" class="bottom-nav-item">
                <div class="bottom-nav-icon">👤</div>
                <span>Profile</span>
            </a>
        </div>
    </nav>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
